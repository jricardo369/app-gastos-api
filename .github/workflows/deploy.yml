name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

# Si el deploy falla, cancela los deploys que esten en cola.
concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          EC2_PATH: ${{ secrets.EC2_PATH }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          envs: DEPLOY_BRANCH,EC2_PATH,REPO_URL
          script: |
            set -eu

            APP_DIR="${EC2_PATH:-$HOME/app-gastos-api}"
            BRANCH="${DEPLOY_BRANCH:-master}"

            echo "==> Directorio: $APP_DIR (rama $BRANCH)"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "==> No hay clone; clonando $REPO_URL en $APP_DIR"
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            # La configuracion vive fuera del repo y sobrevive al reset --hard.
            test -f /opt/app-gastos-configs/application.properties || { echo "Falta /opt/app-gastos-configs/application.properties"; exit 1; }

            echo "==> Verificar MySQL en el host"
            sudo systemctl enable --now mysql 2>/dev/null || sudo systemctl enable --now mysqld 2>/dev/null || true
            i=0
            until sudo ss -ltn | grep -q ':3306 '; do
              i=$((i + 1))
              if [ "$i" -ge 30 ]; then
                echo "MySQL no escucha en 3306; logs:"
                sudo journalctl -u mysql -b -n 60 --no-pager || true
                exit 1
              fi
              sleep 2
            done

            git -C "$APP_DIR" fetch --quiet origin "$BRANCH"
            git -C "$APP_DIR" reset --quiet --hard "origin/$BRANCH"
            git -C "$APP_DIR" log -1 --oneline

            echo "==> Limpieza de Docker antes del build"
            df -h / | tail -1
            docker image prune -af || true
            docker builder prune -af || true
            df -h / | tail -1
            AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
            if [ "$AVAIL_KB" -lt 1000000 ]; then
              echo "Menos de 1 GB libre en /; aborto antes del build"
              exit 1
            fi

            echo "==> Construyendo imagen"
            cd "$APP_DIR"
            docker compose build api

            echo "==> Levantando contenedores"
            docker compose up -d --remove-orphans
            docker image prune -f || true

            echo "==> Esperando healthcheck (hasta 3 minutos)"
            i=0
            until [ "$(docker inspect --format '{{.State.Status}}:{{.State.Health.Status}}' app-gastos-api 2>/dev/null || true)" = "running:healthy" ]; do
              i=$((i + 1))
              if [ "$i" -ge 36 ]; then
                echo "El contenedor no llego a running:healthy. Logs:"
                docker compose logs --tail=80 api
                exit 1
              fi
              sleep 5
            done

            echo "==> API saludable"
            docker compose ps
            df -h / | tail -1
            curl -fsS http://localhost:8080/seg-gastos/api/v1/docs > /dev/null
            echo "Deploy OK: $BRANCH"