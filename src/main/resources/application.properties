spring.application.name=gasto-hogar-api
server.port=8080
server.servlet.context-path=/seg-gastos

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seguimiento_gastos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeit}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToAtLeast32CharactersLong!}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100}

logging.level.com.vjtech.gastoshogar=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN