spring.application.name=gasto-hogar-api-test
server.port=8081

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=testSecretKeyForTestingPurposesOnly32Chars!
jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:8100

logging.level.com.vjtech.gastoshogar=DEBUG